[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-harness-runtime"
version = "0.1.0"
description = "Reusable deterministic runtime for bounded LLM agent work"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
hybrid-harness = "hybrid_harness.cli:main"

[tool.setuptools.packages.find]
include = ["hybrid_harness*"]
